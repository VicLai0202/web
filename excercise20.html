<!DOCTYPE html>
<html>
<head>
<style>
table, td, th {
  padding: 5px;
  border: 1px solid black;
}

table {
  border-collapse: collapse;
  width: 25%;
}

th {
  background-color: gray;
  color: white;
}
tr:nth-child(even){background-color: yellow;}

div {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 150px;
  height: 120px;
  border: 3px solid #73AD21;
  padding: 10px;
}

</style>
</head>
<body>

<table>
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
  </tr>
  <tr>
    <td>1</td>
    <td>1</td>
  </tr>
  <tr>
    <td>2</td>
    <td>2</td>
  </tr>
  <tr>
    <td>3</td>
    <td>3</td>
  </tr>

</table>

<div>This div element has position: fixed;</div>

</body>
</html>
