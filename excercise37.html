<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
</head>
<body>

<div class="container">
    <div class="input-group">
        <label for="radiusInput">Please enter the radius:</label>
        <input type="number" id="radiusInput" value="10" oninput="updateCalculations()">
    </div>

    <h3>1. Circumference (calcCircumfrence)：</h3>
    <div id="circumference-display" class="result"></div>

    <h3>2. Area (calcArea)：</h3>
    <div id="area-display" class="result"></div>
</div>

<script>
    const CircleCalculator = (function() {
        const PI = Math.PI; 
        
        function calcCircumfrence(radius) {
            const circumference = 2 * PI * radius;
            return "The circumference is " + circumference.toFixed(2);
        }

        function calcArea(radius) {
            const area = PI * radius * radius;
            return "The area is " + area.toFixed(2);
        }

        return {
            calcCircumfrence: calcCircumfrence,
            calcArea: calcArea
        };
    })();

    const calcCircumfrence = CircleCalculator.calcCircumfrence;
    const calcArea = CircleCalculator.calcArea;

    function updateCalculations() {
        const radius = parseFloat(document.getElementById("radiusInput").value);
        
        if (isNaN(radius) || radius <= 0) {
            document.getElementById("circumference-display").textContent = "Please enter a valid radius.";
            document.getElementById("area-display").textContent = "Please enter a valid radius.";
            return;
        }

        const circumferenceResult = calcCircumfrence(radius);
        const areaResult = calcArea(radius);

        document.getElementById("circumference-display").textContent = circumferenceResult;
        document.getElementById("area-display").textContent = areaResult;
    }

    updateCalculations();
</script>

</body>
</html>
