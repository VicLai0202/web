<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <style>
        p {
            font-size: 40px;
            font-weight: bold;
            padding: 10px;
            width: 500px;
        }

        p.one {
            background-color: lightblue;
            border-style: double;
            border-width: 10px;
            border-color: Tomato;
        }

        p.two {
            background-color: yellow;
            border-style: solid;
            border-width: 5px;
            border-color: blue;
            border-radius: 20px;
        }

        p.three {
            background-color: MediumSeaGreen;
            border-style: dotted;
            border-width: 15px;
            border-color: Gray;
        }
    </style>
</head>
<body>

    <p class="one">Hello World</p>
    <p class="two">Hello World</p>
    <p class="three">Hello World</p>

</body>
</html>
