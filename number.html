<canvas id="myCanvas" width="400" height="250" style="border:1px solid #d3d3d3;"></canvas>

<script>
  var c = document.getElementById("myCanvas");
  var ctx = c.getContext("2d");

  ctx.fillStyle = "blue";
  ctx.fillRect(20, 20, 150, 150); 
  ctx.lineWidth = 5;
  ctx.strokeStyle = "black";
  ctx.strokeRect(20, 20, 150, 150); 
  
  ctx.beginPath();
  ctx.arc(180, 95, 60, 0, 2 * Math.PI); 
  ctx.fillStyle = "yellow";
  ctx.fill(); 
  ctx.strokeStyle = "red";
  ctx.stroke(); 
</script>
