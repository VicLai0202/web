<!DOCTYPE html>
<html>
<head>
<style>
.image-container {
  display: flex;
  align-items: center; 
  justify-content: flex-start;
  gap:0;
}

.img-1 {
  width: 33%;
  height: 300px; 
  border-radius: 18px; 
  object-fit: cover; 
}

.img-2 {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid #333; 
  object-fit: cover; 
}

.img-3 {
  width: 33%;
  height: 300px;
  object-fit: fill; 
}
</style>
</head>
<body>
<div class="image-container">
  <img src="paris.jpg" class="img-1">

  <img src="img_mountains.jpg" class="img-2">

  <img src="paris.jpg" class="img-3">
</div>

</body>
</html>
