<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body {
    background-color: #f3f3f3; 
    font-family: 'Roboto', sans-serif;
    margin: 0;
  }

  .main-wrapper {
    width: 496px;
    margin: 0 auto; 
    background-color: #ffffff;
    border: 1px solid #eaeaea;
    box-sizing: border-box;
    overflow: hidden; 
  }

  .preview-header {
    width: 100%;
    height: 35px;
    background-color: #f6f6f6;
    box-sizing: border-box;
    padding-top: 0;
    padding-bottom: 0;
    padding-left: 15px;
    padding-right: 22px;
    line-height: 35px;
  }

  .preview-title {
    color: #707070;
    font-size: 13px;
    font-weight: normal;
    float: left;
  }

  .info-btn {
    height: 22px; 
    border-radius: 8px;
    background-color: #ffffff;
    border: 1px solid #2f2f2f;
    color: #2f2f2f;
    font-size: 13px;
    padding: 0 18px;
    cursor: pointer;
    text-decoration: none;
    line-height: 20px;
    box-sizing: border-box;
    float: right;
    margin-top: 6px;
  }

  .btn-close { display: none; }

  .preview-display {
    width: 450px;
    height: 240px;
    background-color: #ffebd6;
    margin-top: 15px;
    margin-left: 20px;  
    margin-right: 26px; 
    text-align: center;
  }

  .preview-image {
    max-width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .details-box {
    display: none; 
    width: 450px;  
    margin-top: 10px;  
    margin-left: 20px;
    margin-right: 26px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  .details-list {
    list-style: none;
    padding: 0;
    margin: 0;
    font-size: 13px;
    color: #2f2f2f;
  }

  .details-list li {
    margin-bottom: 6px; 
  }

  #show:target .details-box { display: block; }
  #show:target .btn-open { display: none; }
  #show:target .btn-close { display: inline-block; }

</style>
</head>
<body>

  <div id="show" class="main-wrapper">
    
    <div class="preview-header">
      <a href="#show" class="info-btn btn-open">查看資訊</a>
      <a href="#" class="info-btn btn-close">收起資訊</a>
      <span class="preview-title">預覽</span>
    </div>

    <div class="preview-display">
      <img src="https://view.japan-web-magazine.com/wp-content/uploads/2020/04/Lake-Kawaguchiko-Mount-Fuji-and-cherry-blossoms-typical-landscape-of-spring-in-Japan.jpg" class="preview-image">
    </div>

    <div class="details-box">
      <ul class="details-list">
        <li>修改日期：2017/10/12</li>
        <li>類別：JPG</li>
        <li>大小：466.97KB</li>
        <li>路徑：\\DesignCenter.qnap.com.tw\sample</li>
      </ul>
    </div>

  </div>

</body>
</html>
